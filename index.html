<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scribe</title>

    <!-- PWA: theme color for the browser/OS chrome (Android status bar, task switcher) -->
    <meta name="theme-color" content="#0035F0" />

    <!--
      iOS has never implemented the general <link rel="manifest"> installability
      spec the way Android/Chrome did, so Safari needs these explicit tags to
      behave like an installed app once added to the home screen (manifest.json
      is still linked separately below for every other browser/OS).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scribe" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      Content Security Policy
      – default-src 'self'          : only load resources from this origin by default
      – script-src 'self' 'unsafe-inline' : Vite dev needs inline scripts; tighten in prod via headers
      – style-src  'self' 'unsafe-inline' : Tailwind injects inline styles
      – img-src    'self' data: blob:      : allow inline data URIs (avatars/icons)
      – connect-src 'self' <backend origin> (https:// and wss://) https://o*.ingest.sentry.io : API calls, real-time WebSocket, and Sentry telemetry
      – font-src   'self'               : no external font CDNs
      – object-src 'none'               : block Flash / plugins
      – frame-ancestors 'none'          : prevent clickjacking (same as X-Frame-Options DENY)
      – base-uri 'self'                 : prevent base-tag injection attacks
      – form-action 'self'              : restrict form submissions to same origin
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self' 'unsafe-inline';
        style-src   'self' 'unsafe-inline';
        img-src     'self' data: blob: https://res.cloudinary.com;
        connect-src 'self' https://ajo-backend-q6dp.onrender.com wss://ajo-backend-q6dp.onrender.com https://o*.ingest.sentry.io https://*.sentry.io;
        font-src    'self';
        object-src  'none';
        frame-ancestors 'none';
        base-uri    'self';
        form-action 'self';
      "
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
