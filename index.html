<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- public/favicon-v3.svg -- same full brand mark as the navbar/
         sidebar/splash (public/ajo-logo.svg), by explicit later request
         superseding an earlier decision to use a simplified ring+shield-
         only mark here because the full 5-element logo was found illegible
         at 16x16 in a browser tab. That legibility tradeoff still applies;
         this is a deliberate choice to have one consistent mark everywhere
         instead.

         A SEPARATE static copy, not ajo-logo.svg directly: that file's
         elements start at opacity:0 and only become visible through a CSS
         reveal animation, which runs fine when it's loaded as page content
         (navbar/sidebar/splash/AjoLoader all use <img>) but never runs in
         the browser's favicon renderer -- pointing the favicon straight at
         ajo-logo.svg rendered as a permanently blank tab icon. favicon-v3.svg
         has the identical artwork with no animation, every element visible
         from the start.

         Named v3, not favicon.svg: that exact filename was already served
         once (before being retired below for Chrome's favicon-cache
         reasons) -- reusing it risks resurrecting a browser's old cached
         entry rather than loading this new content. If Chrome's favicon-
         specific cache (keyed by this href, separate from normal page
         caching) ever needs busting again, change the href itself (a new
         filename, same as this one was) rather than editing the file in
         place. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scribe</title>

    <!-- PWA: theme color for the browser/OS chrome (Android status bar, task switcher) -->
    <meta name="theme-color" content="#0035F0" />

    <!--
      iOS has never implemented the general <link rel="manifest"> installability
      spec the way Android/Chrome did, so Safari needs these explicit tags to
      behave like an installed app once added to the home screen (manifest.json
      is still linked separately below for every other browser/OS).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scribe" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      Content Security Policy
      – default-src 'self'          : only load resources from this origin by default
      – script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client : Vite dev needs inline scripts; Google Identity Services button loader
      – style-src  'self' 'unsafe-inline' https://accounts.google.com/gsi/style : Tailwind injects inline styles; GIS button styling
      – img-src    'self' data: blob:      : allow inline data URIs (avatars/icons)
      – connect-src 'self' <backend origin> (https:// and wss://) https://*.ingest.sentry.io https://accounts.google.com/gsi/ : API calls, real-time WebSocket, Sentry telemetry, GIS credential fetch (CSP wildcards only match a whole label, so "o*.ingest..." was being dropped as invalid — must be "*.ingest...")
      – frame-src  https://accounts.google.com/gsi/ : GIS renders the sign-in button/prompt in an iframe from this origin
      – font-src   'self'               : no external font CDNs
      – object-src 'none'               : block Flash / plugins
      – frame-ancestors 'none'          : prevent clickjacking (same as X-Frame-Options DENY)
      – base-uri 'self'                 : prevent base-tag injection attacks
      – form-action 'self'              : restrict form submissions to same origin
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self' 'unsafe-inline' https://accounts.google.com/gsi/client;
        style-src   'self' 'unsafe-inline' https://accounts.google.com/gsi/style;
        img-src     'self' data: blob: https://res.cloudinary.com;
        connect-src 'self' https://ajo-backend-q6dp.onrender.com wss://ajo-backend-q6dp.onrender.com https://*.ingest.sentry.io https://*.sentry.io https://accounts.google.com/gsi/;
        frame-src   https://accounts.google.com/gsi/;
        font-src    'self';
        object-src  'none';
        frame-ancestors 'none';
        base-uri    'self';
        form-action 'self';
      "
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
